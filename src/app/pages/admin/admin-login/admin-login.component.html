<div class="min-h-screen flex items-center justify-center px-4" style="background-color: var(--background);">
  <div class="max-w-md w-full">
    <div class="rounded-lg p-8" style="background-color: var(--card);">
      <h2 class="text-3xl text-center mb-6" style="font-family:'Urbanist',sans-serif;font-weight:500">
        Panel de Administrador
      </h2>
      
      <form (submit)="login()">
        <div class="mb-6">
          <label class="block mb-2" style="color: var(--foreground);">Email</label>
          <input
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="Ingrese su correo electrónico"
            class="w-full rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F59E0B]" style="background-color: var(--background); border: 1px solid var(--border);"
            [disabled]="isLoading()"
          />
        </div>

        <div class="mb-6">
          <label class="block mb-2" style="color: var(--foreground);">Contraseña</label>
          <input
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="Ingrese su contraseña"
            class="w-full rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F59E0B]" style="background-color: var(--background); border: 1px solid var(--border);"
            [disabled]="isLoading()"
          />
        </div>
        
        <button
          type="submit"
          class="w-full rounded-lg hover:bg-[#F59E0B]/90 transition-all font-medium px-6 py-4" style="background-color: var(--primary); color: #121212;"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Cargando...
            </span>
          } @else {
            Ingresar
          }
        </button>

        <div class="mt-4 text-center">
          <button
            type="button"
            (click)="openResetModal()"
            class="text-red-500 hover:text-red-400 transition-colors text-sm"
          >
            Restablecer Contraseña
          </button>
        </div>
      </form>
    </div>
  </div>

  <app-password-reset-modal
    [isOpen]="showResetModal()"
    (close)="closeResetModal()"
  />
</div>
