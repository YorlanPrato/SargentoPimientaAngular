<div class="min-h-screen flex items-center justify-center bg-[#121212] px-4">
  <div class="max-w-md w-full">
    <div class="bg-[#1E1E1E] rounded-lg p-8">
      <h2 class="text-3xl text-center mb-6" style="font-family:'Urbanist',sans-serif;font-weight:500">
        Panel de Administrador
      </h2>
      
      <form (submit)="login()">
        <div class="mb-6">
          <label class="block mb-2 text-[#F5F5F4]">Contraseña</label>
          <input
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="Ingrese su contraseña"
            class="w-full bg-[#121212] border border-[#F5F5F4]/10 rounded-lg px-4 py-3
                   focus:outline-none focus:ring-2 focus:ring-[#F59E0B]"
            [disabled]="isLoading()"
          />
        </div>
        
        <button
          type="submit"
          class="w-full bg-[#F59E0B] text-[#121212] px-6 py-3 rounded-lg
                 hover:bg-[#F59E0B]/90 transition-all font-medium"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Cargando...
            </span>
          } @else {
            Ingresar
          }
        </button>

        <div class="mt-4 text-center">
          <button
            type="button"
            (click)="resetPassword()"
            class="text-red-500 hover:text-red-400 transition-colors text-sm"
          >
            Restablecer Contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
