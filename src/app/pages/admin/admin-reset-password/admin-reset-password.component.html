<div class="min-h-screen flex items-center justify-center px-4" style="background-color: var(--background);">
  <div class="max-w-md w-full">
    <div class="rounded-lg p-8" style="background-color: var(--card);">
      <h2 class="text-3xl text-center mb-6" style="font-family:'Urbanist',sans-serif;font-weight:500">
        Restablecer Contraseña
      </h2>
      
      @if (!isValidToken()) {
        <p class="text-center" style="color: var(--muted-foreground);">
          Verificando enlace...
        </p>
      } @else {
        <p class="mb-6" style="color: var(--muted-foreground);">
          Ingrese su nueva contraseña
        </p>
        
        <form (submit)="resetPassword()">
          <div class="mb-4">
            <label class="block mb-2" style="color: var(--foreground);">Nueva Contraseña</label>
            <input
              type="password"
              [value]="newPassword()"
              (input)="newPassword.set($any($event.target).value)"
              placeholder="Ingrese su nueva contraseña"
              class="w-full rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F59E0B]" style="background-color: var(--background); border: 1px solid var(--border);"
              [disabled]="isLoading()"
            />
          </div>
          
          <div class="mb-6">
            <label class="block mb-2" style="color: var(--foreground);">Confirmar Contraseña</label>
            <input
              type="password"
              [value]="confirmPassword()"
              (input)="confirmPassword.set($any($event.target).value)"
              placeholder="Confirme su nueva contraseña"
              class="w-full rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F59E0B]" style="background-color: var(--background); border: 1px solid var(--border);"
              [disabled]="isLoading()"
            />
          </div>
          
          <button
            type="submit"
            class="w-full rounded-lg hover:bg-[#F59E0B]/90 transition-all font-medium px-6 py-4" style="background-color: var(--primary); color: #121212;"
            [disabled]="isLoading()"
          >
            @if (isLoading()) {
              <span class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Actualizando...
              </span>
            } @else {
              Actualizar Contraseña
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
