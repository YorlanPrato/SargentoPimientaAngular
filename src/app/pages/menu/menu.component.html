<div class="min-h-screen py-8 page-enter">
  <div class="max-w-6xl mx-auto px-4">

    <h2 class="text-4xl text-center mb-8" style="font-family:'Urbanist',sans-serif;font-weight:500">
      Nuestra Carta
    </h2>

    <!-- Category Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-4 mb-8 scrollbar-hide">
      @for (cat of categories(); track cat.id) {
        <button
          (click)="setCategory(cat.nombre)"
          class="px-6 py-3 rounded-lg whitespace-nowrap transition-all"
          [class]="activeCategory() === cat.nombre
            ? 'bg-[#F59E0B] text-[#121212]'
            : 'bg-[#1E1E1E] text-[#F5F5F4] hover:bg-[#2A2A2A]'"
        >
          {{ cat.nombre }}
        </button>
      }
    </div>

    <!-- Menu Items Grid -->
    <div class="grid md:grid-cols-2 gap-6">
      @for (item of currentItems(); track item.id) {
        <div class="bg-[#1E1E1E] rounded-lg overflow-hidden hover:ring-2 hover:ring-[#F59E0B] transition-all">

          <!-- Image -->
          <div class="relative h-48">
            @if (item.imagen_url) {
              <img
                [src]="item.imagen_url"
                [alt]="item.nombre"
                class="w-full h-full object-cover"
              />
            }
            @if (!item.disponible) {
              <div class="absolute inset-0 bg-black/70 flex items-center justify-center">
                <span class="bg-[#DC2626] px-4 py-2 rounded-lg flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                  No Disponible
                </span>
              </div>
            }
          </div>

          <!-- Details -->
          <div class="p-5">
            <div class="flex justify-between items-start mb-2">
              <h3 class="flex-1" style="font-family:'Urbanist',sans-serif;font-weight:500">
                {{ item.nombre }}
              </h3>
              <span class="text-[#F59E0B] ml-4 whitespace-nowrap">
                ${{ item.precio.toFixed(2) }}
              </span>
            </div>
            <p class="text-[#A8A8A8] text-sm mb-3">{{ item.descripcion }}</p>
            @if (item.disponible) {
              <div class="flex items-center gap-2 text-[#4ADE80] text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                Disponible
              </div>
            }
          </div>

        </div>
      }
    </div>

  </div>
</div>
