@if (!minimal) {
  <div class="py-8 md:py-16 px-4">
    <div class="max-w-6xl mx-auto">
      @if (showHeader) {
        <div class="text-center mb-6 md:mb-12">
          <h2 class="text-4xl mb-3" style="font-family:'Urbanist',sans-serif;font-weight:500">
            Eventos en Vivo
          </h2>
        </div>
      }
    </div>
  </div>
}

<!-- Carousel -->
<div class="relative mx-8 mt-4 md:ml-16 md:mr-8 md:mt-12">
  <!-- Card -->
  <div class="rounded-2xl overflow-hidden h-auto md:h-96 bg-[#2A2A2A]">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 h-full min-h-0">

      <!-- Image -->
      <div class="relative h-64 md:h-auto min-h-0">
        <img
          [src]="currentEvent().image"
          [alt]="currentEvent().title"
          class="w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
      </div>

      <!-- Details -->
      <div class="p-4 md:p-8 flex flex-col justify-center min-h-0 overflow-y-auto">

        <div class="inline-block bg-[#F59E0B] text-[#121212] text-xs px-2 py-1 rounded-full mb-3 self-start">
          {{ currentEvent().genre }}
        </div>

        <h3 class="text-xl md:text-2xl lg:text-3xl xl:text-4xl mb-3" style="font-family:'Urbanist',sans-serif;font-weight:500; color: #F5F5F4;">
          {{ currentEvent().title }}
        </h3>

        <div class="space-y-2 mb-4">

          <!-- Artist -->
          <div class="flex items-center gap-2 text-[#F5F5F4]/80 text-xs md:text-sm lg:text-base">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#F59E0B] shrink-0"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <span>{{ currentEvent().artist }}</span>
          </div>

          <!-- Date -->
          <div class="flex items-center gap-2 text-[#F5F5F4]/80 text-xs md:text-sm lg:text-base">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#F59E0B] shrink-0"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>{{ currentEvent().date }}</span>
          </div>

          <!-- Time -->
          <div class="flex items-center gap-2 text-[#F5F5F4]/80 text-xs md:text-sm lg:text-base">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#F59E0B] shrink-0"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>{{ currentEvent().time }}</span>
          </div>

        </div>

        <p class="text-[#A8A8A8] text-xs md:text-sm lg:text-base">{{ currentEvent().description }}</p>
      </div>

    </div>
  </div>

  <!-- Prev Button -->
  <button
    (click)="prev()"
    aria-label="Evento anterior"
    class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 z-10
           bg-[#F59E0B] text-[#121212] p-2 rounded-full hover:bg-[#F59E0B]/90 transition-all shadow-lg"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <!-- Next Button -->
  <button
    (click)="next()"
    aria-label="Evento siguiente"
    class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 z-10
           bg-[#F59E0B] text-[#121212] p-2 rounded-full hover:bg-[#F59E0B]/90 transition-all shadow-lg"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <!-- Dots -->
  <div class="flex justify-center gap-2 mt-4 pb-8">
    @for (event of events; track event.id; let i = $index) {
      <button
        (click)="goTo(i)"
        [attr.aria-label]="'Ir al evento ' + (i + 1)"
        class="h-2 rounded-full transition-all"
        [class]="i === currentIndex()
          ? 'w-8 bg-[#F59E0B]'
          : 'w-2 bg-[#F5F5F4]/30 hover:bg-[#F5F5F4]/50'"
      ></button>
    }
  </div>

</div>
