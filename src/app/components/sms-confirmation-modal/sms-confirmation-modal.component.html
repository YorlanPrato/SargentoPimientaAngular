@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background-color: rgba(0, 0, 0, 0.7);">
    <div class="rounded-lg p-6 max-w-md w-full" style="background-color: var(--card); border: 1px solid var(--border);">
      <h2 class="text-2xl mb-4" style="font-family: 'Urbanist', sans-serif; font-weight: 500; color: var(--foreground);">
        Confirmación por SMS
      </h2>
      
      <p class="mb-4" style="color: var(--muted-foreground);">
        Hemos enviado un código de confirmación al número:
      </p>
      
      <p class="mb-6 font-medium" style="color: var(--foreground);">
        {{ phoneNumber() }}
      </p>
      
      <div class="mb-6">
        <label class="block mb-2" style="color: var(--foreground);">
          Ingresa el código de verificación:
        </label>
        <input
          type="text"
          [(ngModel)]="verificationCode"
          class="w-full px-4 py-3 rounded-lg text-center text-2xl tracking-widest"
          style="background-color: var(--input); color: var(--foreground); border: 1px solid var(--border);"
          placeholder="000000"
          maxlength="6"
        />
      </div>
      
      <div class="flex gap-4">
        <button
          (click)="onCancel()"
          class="flex-1 px-6 py-3 rounded-lg transition-all"
          style="background-color: var(--muted); color: var(--foreground);"
        >
          Cancelar
        </button>
        <button
          (click)="onConfirm()"
          [disabled]="isLoading()"
          class="flex-1 px-6 py-3 rounded-lg transition-all"
          style="background-color: var(--primary); color: var(--primary-foreground);"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Verificando...
            </span>
          } @else {
            Confirmar
          }
        </button>
      </div>
    </div>
  </div>
}
