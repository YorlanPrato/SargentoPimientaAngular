@if (isOpen()) {
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="rounded-lg p-6 max-w-md w-full" style="background-color: var(--card);">
      <h2 class="text-2xl mb-4" style="color: var(--foreground);">Restablecer Contraseña</h2>
      
      <p class="mb-4" style="color: var(--muted-foreground);">
        Ingrese su correo electrónico para recibir instrucciones de recuperación de contraseña.
      </p>
      
      <div class="mb-4">
        <label class="block mb-2" style="color: var(--foreground);">Email</label>
        <input
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="Ingrese su correo electrónico"
          class="w-full rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#F59E0B]"
          style="background-color: var(--background); border: 1px solid var(--border);"
          [disabled]="isLoading()"
        />
      </div>
      
      <div class="flex gap-3">
        <button
          type="button"
          (click)="close.emit()"
          class="flex-1 rounded-lg hover:bg-gray-600 transition-all font-medium px-6 py-3"
          style="background-color: var(--secondary); color: var(--foreground);"
          [disabled]="isLoading()"
        >
          Cancelar
        </button>
        
        <button
          type="button"
          (click)="resetPassword()"
          class="flex-1 rounded-lg hover:bg-[#F59E0B]/90 transition-all font-medium px-6 py-3"
          style="background-color: var(--primary); color: #121212;"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Enviando...
            </span>
          } @else {
            Enviar
          }
        </button>
      </div>
    </div>
  </div>
}
